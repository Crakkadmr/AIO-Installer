name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AIOInstaller.sln

      - name: Build Release
        run: msbuild AIOInstaller.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Get tag version
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ steps.get_version.outputs.VERSION }}" setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AIO Installer v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## AIO Installer v${{ steps.get_version.outputs.VERSION }}

            ### Kurulum
            1. `AIOInstaller-Setup.exe` dosyasını indirin
            2. Çalıştırın ve kurulum sihirbazını takip edin
            3. AIO Installer başlatıcıdan çalıştırın
          files: Output/AIOInstaller-Setup.exe
          draft: false
          prerelease: false
